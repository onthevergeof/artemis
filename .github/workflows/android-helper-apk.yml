name: Android helper APK

on:
  workflow_dispatch:
  push:
    paths:
      - "packages/artemis-accessibility-helper/**"
      - ".github/workflows/android-helper-apk.yml"
  pull_request:
    paths:
      - "packages/artemis-accessibility-helper/**"
      - ".github/workflows/android-helper-apk.yml"

permissions:
  contents: read

jobs:
  build-helper:
    name: Build existing accessibility helper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Locate the SDK manager in the runner's preinstalled Android SDK.
      # Do not depend on sdkmanager being added to PATH by the runner image.
      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 3 -type d | head -80 || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build helper APK
        shell: bash
        run: |
          cd packages/artemis-accessibility-helper
          chmod +x build_apk.sh
          ./build_apk.sh

      - name: Verify APK exists and manifest is generated
        shell: bash
        run: |
          test -s packages/artemis-accessibility-helper/ArtemisAccessibilityHelper.apk
          test -s packages/artemis-accessibility-helper/helper_manifest.json
          sha256sum packages/artemis-accessibility-helper/ArtemisAccessibilityHelper.apk
          cat packages/artemis-accessibility-helper/helper_manifest.json

      - name: Upload helper APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtemisAccessibilityHelper
          path: |
            packages/artemis-accessibility-helper/ArtemisAccessibilityHelper.apk
            packages/artemis-accessibility-helper/helper_manifest.json
          if-no-files-found: error
          retention-days: 14
