name: ARTEMIS Android Console APK

on:
  push:
    branches:
      - android-standalone-port
    paths:
      - "android-app/**"
      - ".github/workflows/android-console-apk.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-console-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-console-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android-app :app:assembleDebug

      - name: Verify package identity and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          EXPECTED_APPLICATION_ID="$(sed -n 's/^[[:space:]]*applicationId = "\([^"]*\)".*/\1/p' android-app/app/build.gradle.kts | head -n 1)"
          EXPECTED_VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' android-app/app/build.gradle.kts | head -n 1)"
          test -n "$EXPECTED_APPLICATION_ID"
          test -n "$EXPECTED_VERSION_NAME"
          apkanalyzer manifest application-id "$APK" | grep -Fx "$EXPECTED_APPLICATION_ID"
          apkanalyzer manifest version-name "$APK" | grep -Fx "$EXPECTED_VERSION_NAME"
          unzip -Z1 "$APK" | grep -Fx "lib/arm64-v8a/libpython3.12.so"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTEMIS-Android-Console-debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
