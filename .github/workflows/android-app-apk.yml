name: ARTEMIS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-standalone-port
    paths:
      - "android-app/**"
      - "packages/artemis-accessibility-helper/app/src/main/java/**"
      - "packages/artemis-accessibility-helper/app/src/main/res/**"
      - ".github/workflows/android-app-apk.yml"

permissions:
  contents: read

concurrency:
  group: artemis-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build ARTEMIS Android APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools;platforms;android-35;build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK, package, ABI and embedded Python runtime
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/artemis-badging.txt
          grep -q "package: name='com.artemis.android'" /tmp/artemis-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | tee /tmp/artemis-apk-contents.txt
          grep -q "lib/arm64-v8a/" /tmp/artemis-apk-contents.txt
          grep -q "assets/chaquopy/" /tmp/artemis-apk-contents.txt
          cp "$APK" "ARTEMIS-Android-Console-0.3.1-debug.apk"
          sha256sum "ARTEMIS-Android-Console-0.3.1-debug.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ARTEMIS-Android-Console-0.3.1
          path: ARTEMIS-Android-Console-0.3.1-debug.apk
          if-no-files-found: error
          retention-days: 30
